<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZoomData Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 20px;
        color: #333;
      }

      .viewer-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .canvas-wrapper {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 16px;
      }

      #zoomCanvas {
        display: block;
        border: 1px solid #ddd;
        cursor: grab;
      }

      .controls {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 16px;
        min-width: 200px;
      }

      .control-group {
        margin-bottom: 16px;
      }

      .control-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
        color: #555;
      }

      .control-group .value {
        font-family: monospace;
        font-size: 14px;
        color: #333;
      }

      .color-bar {
        display: flex;
        height: 24px;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid #ddd;
      }

      .color-bar div {
        flex: 1;
      }

      .color-labels {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #666;
        margin-top: 4px;
      }

      button {
        background: #4a90d9;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background: #357abd;
      }

      select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        background: white;
        cursor: pointer;
      }

      select:focus {
        outline: none;
        border-color: #4a90d9;
      }

      .error {
        background: #fee;
        border: 1px solid #fcc;
        color: #c00;
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 16px;
      }

      .instructions {
        color: #666;
        font-size: 14px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ZoomData Demo</h1>

      <div id="error" class="error" style="display: none;"></div>

      <div class="viewer-container">
        <div class="canvas-wrapper">
          <canvas id="zoomCanvas" width="800" height="600"></canvas>
          <p class="instructions">
            Scroll to zoom, drag to pan
          </p>
        </div>

        <div class="controls">
          <div class="control-group">
            <label>Zoom Level</label>
            <span id="zoomValue" class="value">-</span>
          </div>

          <div class="control-group">
            <label for="colormapSelect">Colormap</label>
            <select id="colormapSelect">
              <option value="inferno" selected>Inferno</option>
              <option value="viridis">Viridis</option>
              <option value="magma">Magma</option>
              <option value="plasma">Plasma</option>
              <option value="grayscale">Grayscale</option>
            </select>
          </div>

          <div class="control-group">
            <label>Color Scale</label>
            <div id="colorBar" class="color-bar"></div>
            <div class="color-labels">
              <span id="minValue">-45.58</span>
              <span id="maxValue">-27.22</span>
            </div>
          </div>

          <div class="control-group">
            <button id="resetBtn">Reset View</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZoomData Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 20px;
        color: #333;
      }

      .viewer-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .viewer-panels {
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }

      .left-panel {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .panel-label {
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 2px;
      }

      .center-panel {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .canvas-wrapper {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 16px;
        position: relative;
      }

      #zoomCanvas {
        display: block;
        border: 1px solid #ddd;
        cursor: grab;
      }

      .canvas-inner {
        position: relative;
        display: inline-block;
        line-height: 0;
      }

      #zoomCanvas-crosshair {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }

      #hScanCanvas,
      #vScanCanvas {
        display: block;
        border-radius: 4px;
        border: 1px solid #ddd;
        background: #c0c2c5;
      }

      .controls {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 16px;
        min-width: 200px;
      }

      .control-group {
        margin-bottom: 16px;
      }

      .control-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
        color: #555;
      }

      .control-group .value {
        font-family: monospace;
        font-size: 14px;
        color: #333;
      }

      button {
        background: #4a90d9;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background: #357abd;
      }

      select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        background: white;
        cursor: pointer;
      }

      select:focus {
        outline: none;
        border-color: #4a90d9;
      }

      .error {
        background: #fee;
        border: 1px solid #fcc;
        color: #c00;
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 16px;
      }

      .instructions {
        color: #666;
        font-size: 14px;
        margin-top: 8px;
      }

      #scalebar {
        position: absolute;
        bottom: 60px;
        left: 32px;
        pointer-events: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(100, 180, 160, 0.55);
        border-radius: 6px;
        padding: 5px 12px;
        backdrop-filter: blur(2px);
      }

      #scalebar-bar {
        height: 3px;
        background: white;
        border: none;
        flex-shrink: 0;
        transition: width 0.2s ease;
      }

      #scalebar-label {
        color: white;
        font-size: 13px;
        font-family: monospace;
        white-space: nowrap;
        font-weight: 500;
      }

      .crosshair-info {
        font-family: monospace;
        font-size: 12px;
        color: #555;
        min-height: 20px;
      }

      #clearCrosshairBtn {
        background: #e05050;
        margin-top: 4px;
      }
      #clearCrosshairBtn:hover {
        background: #c03030;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ZoomData Demo</h1>

      <div id="error" class="error" style="display: none"></div>

      <div class="viewer-container">
        <div class="viewer-panels">
          <div id="left-panel" class="left-panel">
            <div class="panel-label">Vertical profile</div>
            <canvas id="vScanCanvas" width="180" height="600"></canvas>
          </div>
          <div class="center-panel">
            <div class="canvas-wrapper">
              <div class="canvas-inner">
                <canvas id="zoomCanvas" width="800" height="600"></canvas>
                <canvas id="zoomCanvas-crosshair" width="800" height="600"></canvas>
              </div>
              <div id="scalebar">
                <div id="scalebar-bar"></div>
                <div id="scalebar-label"></div>
              </div>
              <p class="instructions">
                Scroll to zoom · drag to pan · double-click to place crosshair
              </p>
            </div>
            <div id="bottom-panel" class="bottom-panel">
              <div class="panel-label">Horizontal profile</div>
              <canvas id="hScanCanvas" width="800" height="130"></canvas>
            </div>
          </div>
        </div>
        <div class="controls">
          <div class="control-group">
            <label>Zoom Level</label>
            <span id="zoomValue" class="value">-</span>
          </div>

          <div class="control-group">
            <label for="colormapSelect">Colormap</label>
            <select id="colormapSelect">
              <option value="inferno" selected>Inferno</option>
              <option value="viridis">Viridis</option>
              <option value="magma">Magma</option>
              <option value="plasma">Plasma</option>
              <option value="grayscale">Grayscale</option>
            </select>
          </div>

          <div class="control-group">
            <label>Color Scale</label>
            <canvas id="colorbarCanvas" width="110" height="260"></canvas>
          </div>

          <div class="control-group">
            <label>Crosshair position</label>
            <div id="crosshairInfo" class="crosshair-info">—</div>
            <button id="clearCrosshairBtn" style="display: none">Clear crosshair</button>
          </div>

          <div class="control-group">
            <button id="resetBtn">Reset View</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
